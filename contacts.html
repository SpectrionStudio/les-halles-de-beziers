<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>
    <link rel="stylesheet" href="css/contacts.css">
</head>
<body>

<section class="contact-container">

    <!-- IMAGE À GAUCHE -->

    <div class="contact-image">
        
        <img src="image/carte.png" alt="Carte de localisation">

        
    </div>

    <!-- FORMULAIRE À DROITE -->
    <div class="contact-form">
        <h1>Contactez-nous</h1>

        <form>
            <label for="name">Nom</label>
            <input type="text" id="name" placeholder="Votre nom" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Votre email" required>

            <label for="subject">Sujet</label>
            <input type="text" id="subject" placeholder="Sujet du message">

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="écrivez votre message" required></textarea>

            <button type="submit">Envoyer nous votre message</button>
        </form>
    </div>

</section>

</body>
</html>
